[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "nlip-angel-filter"
version = "0.1.0"
description = "ECMA-430 NLIP Federator Angel Filter - local re-ranking engine to counter steered AI recommendations"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "python-multipart>=0.0.12",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "httpx>=0.28.0,<1.0.0",
    "PyJWT>=2.10.0,<3.0.0",
    "openai>=1.58.0,<2.0.0",
    "google-genai>=0.1.0",
    "ibm-watson>=8.1.0",
    "ollama>=0.4.0",
    "plotly>=5.24.0,<6.0.0",
]
